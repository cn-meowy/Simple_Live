name: app-build-action
#推送Tag时触发
on:
    push:
        tags:
            - "dev_tv_v*"
jobs:
    build-tv:
        runs-on: macos-latest
        permissions:
            contents: write
        steps:
            #签出代码
            - uses: actions/checkout@v4
              with:
                  ref: dev

            #APK签名设置
            - name: Check keystore secret
              run: |
                if [ -z "${{ secrets.TV_KEYSTORE_BASE64 }}" ]; then
                  echo "::error::Secret TV_KEYSTORE_BASE64 未配置。请在仓库 Settings → Secrets 添加 keystore 的 base64 值。"
                  exit 1
                fi
            - name: Download Android keystore
              id: android_tv_keystore
              uses: timheuer/base64-to-file@v1.2
              with:
                  fileName: keystore.jks
                  encodedString: ${{ secrets.TV_KEYSTORE_BASE64 }}
            - name: Create key.properties
              run: |
                  echo "storeFile=${{ steps.android_tv_keystore.outputs.filePath }}" > simple_live_tv_app/android/key.properties
                  echo "storePassword=${{ secrets.TV_STORE_PASSWORD }}" >> simple_live_tv_app/android/key.properties
                  echo "keyPassword=${{ secrets.TV_KEY_PASSWORD }}" >> simple_live_tv_app/android/key.properties
                  echo "keyAlias=${{ secrets.TV_KEY_ALIAS }}" >> simple_live_tv_app/android/key.properties

            # 设置JAVA环境
            - uses: actions/setup-java@v4
              with:
                  distribution: "zulu"
                  java-version: "17"
                  cache: "gradle"

            #设置Flutter
            - name: Flutter action
              uses: subosito/flutter-action@v2
              with:
                  flutter-version: "3.38.x"
                  cache: true

            #更新Flutter的packages
            - name: Restore packages
              run: |
                  cd simple_live_tv_app
                  flutter pub get

            #获取版本信息（自动从 Git Tag 提取，去掉 dev_tv_v 前缀）
            - name: Get version from tag
              id: version
              run: echo "VERSION=${GITHUB_REF#refs/tags/dev_tv_v}" >> $GITHUB_OUTPUT
            - name: Echo version
              run: echo "${{ steps.version.outputs.VERSION }}"

            #打包APK
            - name: Build APK
              run: |
                  cd simple_live_tv_app
                  flutter build apk --release --split-per-abi

            #重命名APK
            - name: Rename APK
              run: |
                  cd simple_live_tv_app/build/app/outputs/flutter-apk
                  mv app-armeabi-v7a-release.apk MeowLive-android-tv-armeabi-v7a-${{ steps.version.outputs.VERSION }}.apk
                  mv app-arm64-v8a-release.apk MeowLive-android-tv-arm64-v8a-${{ steps.version.outputs.VERSION }}.apk
                  mv app-x86_64-release.apk MeowLive-android-tv-x86_64-${{ steps.version.outputs.VERSION }}.apk

            #上传APK至Artifacts
            - name: Upload APK to Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: android_tv
                  path: |
                      simple_live_tv_app/build/app/outputs/flutter-apk/MeowLive-android-tv-armeabi-v7a-${{ steps.version.outputs.VERSION }}.apk
                      simple_live_tv_app/build/app/outputs/flutter-apk/MeowLive-android-tv-arm64-v8a-${{ steps.version.outputs.VERSION }}.apk
                      simple_live_tv_app/build/app/outputs/flutter-apk/MeowLive-android-tv-x86_64-${{ steps.version.outputs.VERSION }}.apk
            #完成
            - run: echo "🍏 This job's status is ${{ job.status }}."
