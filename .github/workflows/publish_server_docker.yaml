name: server-docker-action
# 推送 server_v* tag 时触发构建并推送到 DockerHub + GHCR
on:
  push:
    tags:
      - "server_v*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest
    steps:
      # 签出代码
      - uses: actions/checkout@v4

      # Docker 元数据（双 registry 镜像标签）
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            xiaosheng078/meow-live-server
            ghcr.io/cn-meowy/meow-live-server
          tags: |
            type=match,pattern=server_v(.*),group=1
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # 多架构支持（QEMU）
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录 DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 登录 GHCR
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 构建并推送（一次构建同时推送两个 registry）
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: simple_live_server_nodejs
          file: simple_live_server_nodejs/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 完成
      - run: echo "🍏 This job's status is ${{ job.status }}."
